<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TSM Shortener - Encurtador de Links</title>
  <!-- Fonte Google para visual moderno e divertido -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-blue: #0B5C82;
      --primary-green: #6BB343;
      --bg-gradient: linear-gradient(135deg, #e0f2fe 0%, #e8f5e9 100%);
      --card-bg: rgba(255, 255, 255, 0.95);
      --text-color: #2c3e50;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: var(--text-color);
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 520px;
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(11, 92, 130, 0.15);
      text-align: center;
      backdrop-filter: blur(10px);
      transition: transform 0.3s ease;
    }

    .container:hover {
      transform: translateY(-5px);
    }

    .logo-container {
      margin-bottom: 20px;
    }

    .logo-container img {
      max-width: 220px;
      height: auto;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05));
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--primary-blue);
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 0.95rem;
      color: #666;
      margin-bottom: 30px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 25px;
    }

    input[type="url"] {
      width: 100%;
      padding: 16px 20px;
      border: 2px solid #e0e6ed;
      border-radius: 16px;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s ease;
      background: #f8fafc;
    }

    input[type="url"]:focus {
      border-color: var(--primary-green);
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(107, 179, 67, 0.2);
    }

    button.btn-shorten {
      background: linear-gradient(45deg, var(--primary-blue), var(--primary-green));
      color: #ffffff;
      border: none;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 8px 15px rgba(11, 92, 130, 0.2);
    }

    button.btn-shorten:hover {
      opacity: 0.95;
      transform: scale(1.02);
      box-shadow: 0 12px 20px rgba(107, 179, 67, 0.3);
    }

    button.btn-shorten:active {
      transform: scale(0.98);
    }

    /* Card de Resultado */
    .result-card {
      display: none;
      background: #f0fdf4;
      border: 2px dashed var(--primary-green);
      padding: 20px;
      border-radius: 16px;
      margin-top: 20px;
      animation: fadeIn 0.4s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-card p {
      font-size: 0.85rem;
      color: #166534;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .short-url {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--primary-blue);
      word-break: break-all;
      margin-bottom: 15px;
      display: block;
      text-decoration: none;
    }

    .short-url:hover {
      text-decoration: underline;
    }

    .btn-copy {
      background: var(--primary-blue);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-copy:hover {
      background: #084361;
    }

    /* Loader */
    .loader {
      display: none;
      margin: 15px auto;
      border: 4px solid #f3f3f3;
      border-top: 4px solid var(--primary-green);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .error-msg {
      color: #dc2626;
      font-size: 0.85rem;
      margin-top: 10px;
      display: none;
    }

    footer {
      margin-top: 25px;
      font-size: 0.75rem;
      color: #888;
    }

    @media (max-width: 480px) {
      .container {
        padding: 30px 20px;
      }
      h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Logo do Anexo -->
    <div class="logo-container">
      <img src="1000369098.png" alt="TSM - Tecnologia, Sustentabilidade e Gestão" id="logo">
    </div>

    <h1>Encurtador de Links 🌱</h1>
    <p class="subtitle">Diminua seus links de forma simples, rápida e ecológica!</p>

    <div class="input-group">
      <input type="url" id="longUrl" placeholder="Cole sua URL longa aqui (ex: https://...)" required />
      <button class="btn-shorten" onclick="shortenLink()">Encurtar Agora ✨</button>
    </div>

    <div class="loader" id="loader"></div>
    <div class="error-msg" id="errorMsg">Por favor, insira uma URL válida contendo http:// ou https://</div>

    <!-- Área de resultado -->
    <div class="result-card" id="resultCard">
      <p>🎉 Seu link encurtado está pronto!</p>
      <a href="#" id="shortLink" target="_blank" class="short-url"></a>
      <button class="btn-copy" id="btnCopy" onclick="copyToClipboard()">📋 Copiar Link</button>
    </div>

    <footer>
      TSM &copy; Tecnologia, Sustentabilidade e Gestão
    </footer>
  </div>

  <script>
    async function shortenLink() {
      const longUrlInput = document.getElementById('longUrl');
      const longUrl = longUrlInput.value.trim();
      const loader = document.getElementById('loader');
      const resultCard = document.getElementById('resultCard');
      const errorMsg = document.getElementById('errorMsg');
      const shortLinkAnchor = document.getElementById('shortLink');
      const btnCopy = document.getElementById('btnCopy');

      // Ocultar resultados anteriores
      resultCard.style.display = 'none';
      errorMsg.style.display = 'none';
      btnCopy.innerText = '📋 Copiar Link';

      // Validação simples de URL
      if (!longUrl || (!longUrl.startsWith('http://') && !longUrl.startsWith('https://'))) {
        errorMsg.style.display = 'block';
        return;
      }

      loader.style.display = 'block';

      try {
        // Requisição para a API gratuita do TinyURL
        const response = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(longUrl)}`);
        
        if (!response.ok) {
          throw new Error('Falha ao encurtar a URL');
        }

        const shortUrl = await response.text();

        // Atualiza a interface
        shortLinkAnchor.href = shortUrl;
        shortLinkAnchor.innerText = shortUrl;
        resultCard.style.display = 'block';
      } catch (err) {
        errorMsg.innerText = 'Ocorreu um erro ao encurtar o link. Tente novamente.';
        errorMsg.style.display = 'block';
      } finally {
        loader.style.display = 'none';
      }
    }

    function copyToClipboard() {
      const shortUrl = document.getElementById('shortLink').innerText;
      const btnCopy = document.getElementById('btnCopy');

      navigator.clipboard.writeText(shortUrl).then(() => {
        btnCopy.innerText = '✅ Copiado!';
        setTimeout(() => {
          btnCopy.innerText = '📋 Copiar Link';
        }, 3000);
      }).catch(err => {
        alert('Erro ao copiar o link.');
      });
    }
  </script>

</body>
</html>
